version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    groups:
      headlamp-plugin:
        patterns:
          - '@kinvolk/headlamp-plugin'
          - '@headlamp-k8s/*'
      vite:
        patterns:
          - 'vite'
          - 'vite-plugin-*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
